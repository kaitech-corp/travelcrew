---
name: travelcrew
description: Travel Crew is a mobile app for friends to share travel plans, organize travel and even create full itineraries together.
version: 3.2.0+86
publish_to: none

environment:
  sdk: '>=3.0.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # API
  http: ^1.2.1
  oauth2_client: ^3.3.0
  google_places_flutter: ^2.0.9
  geocoding: ^3.0.0
  geolocator: ^13.0.2

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Data
  faker: ^2.2.0
  flutter_dotenv: ^5.2.1
  grouped_list: ^6.0.0
  multiple_stream_builder: ^3.0.2
  shared_preferences: ^2.3.5
  sticky_grouped_list: ^3.1.0

  # Features
  add_2_calendar: ^3.0.1
  clipboard: ^0.1.3
  in_app_review: ^2.0.10
  showcaseview: ^4.0.0
  share_plus: ^10.1.4

  # Firebase
  cloud_functions: ^5.1.0
  cloud_firestore: ^5.3.0
  firebase_analytics: ^11.3.0
  firebase_auth: ^5.3.2
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.0
  firebase_database: ^11.1.0
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.4.0
  firebase_performance: ^0.10.1

  # Images
  image_cropper: ^8.1.0
  image_picker: ^1.1.2

  # Notifications
  flutter_app_badge: ^2.0.2
  flutter_local_notifications: ^18.0.1
  fluttertoast: ^8.2.10
#  notification_permissions: ^0.6.1

  # State Management
  bloc: ^8.1.4
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  observable: ^0.24.0
  get_it: ^7.7.0
  provider: ^6.1.2

  # Self Packaged
  flappy_search_bar:
    path: packages/flappy_search_bar
  split_costs:
    path: packages/split_project

  # Web
  any_link_preview: 
    path: packages/any_link_preview
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0

  # UI
  animated_splash_screen: ^1.3.0
  animations: ^2.0.11
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  draggable_scrollbar: ^0.1.0
  eva_icons_flutter: ^3.1.0
  expandable: ^5.0.1
  flutter_animation_progress_bar: ^2.3.1
  flutter_spinkit: ^5.2.1
  modal_bottom_sheet: ^3.0.0
  responsive_framework: ^1.5.0
  rxdart: ^0.27.2
  sizer: ^3.0.5
  syncfusion_flutter_gauges: ^28.1.39

  # Other
  nil: ^1.1.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  freezed: ^3.0.0-0.0.dev
  json_serializable: ^6.9.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  datetime_picker_formfield_new: ^2.1.0
  firebase_app_check: ^0.3.2+1
 

dev_dependencies:
  build_runner: ^2.3.3
  flutter_test:
    sdk: flutter

flutter_intl:
  enabled: true

flutter:
  generate: true
  uses-material-design: true
  assets:
  - ./.env
  - assets/images/
  fonts:
  - family: Raleway
    fonts:
    - asset: assets/fonts/Raleway-VariableFont_wght.ttf
  - family: Cantata One
    fonts:
    - asset: assets/fonts/CantataOne-Regular.ttf
  - family: RockSalt
    fonts:
    - asset: assets/fonts/RockSalt-Regular.ttf
  - family: Lato Black
    fonts:
    - asset: assets/fonts/Lato-Black.ttf
  - family: Playfair
    fonts:
    - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
    - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf
      style: italic


